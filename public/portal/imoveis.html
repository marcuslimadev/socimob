<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imóveis Disponíveis - SOCIMOB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/portal.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body class="portal-body">
    <!-- Navbar -->
    <nav class="portal-nav py-3 sticky-top">
        <div class="container d-flex flex-wrap align-items-center justify-content-between gap-3">
            <div class="d-flex align-items-center gap-3">
                <div class="brand-badge">🏠 SOCIMOB</div>
                <span class="brand-pill">Portal do Cliente</span>
            </div>
            <div class="d-flex align-items-center gap-3">
                <span id="userName" class="fw-semibold"></span>
                <button id="btnLogout" class="btn btn-portal-outline">Sair</button>
            </div>
        </div>
    </nav>

    <!-- Conteúdo -->
    <div class="container py-4">
        <!-- Header -->
        <div class="portal-hero">
            <div class="hero-tag">Catálogo exclusivo</div>
            <h2 class="hero-title">Imóveis Disponíveis</h2>
            <p class="hero-subtitle">Encontre o imóvel perfeito com detalhes claros e um visual de alto contraste.</p>
        </div>

        <!-- Filtros -->
        <div class="filter-panel mb-4">
            <div class="row g-3">
                <div class="col-12 col-md-3">
                    <input type="text" id="searchImovel" placeholder="Buscar por localização..."
                        class="form-control">
                </div>
                <div class="col-12 col-md-3">
                    <select id="filterTipo" class="form-select">
                    <option value="">Todos os tipos</option>
                    <option value="casa">Casa</option>
                    <option value="apartamento">Apartamento</option>
                    <option value="terreno">Terreno</option>
                    <option value="comercial">Comercial</option>
                    </select>
                </div>
                <div class="col-12 col-md-3">
                    <select id="filterFinalidade" class="form-select">
                    <option value="">Todas finalidades</option>
                    <option value="venda">Venda</option>
                    <option value="aluguel">Aluguel</option>
                    </select>
                </div>
                <div class="col-12 col-md-3 d-grid">
                    <button id="btnFiltrar" class="btn btn-portal">
                        🔍 Buscar
                    </button>
                </div>
            </div>
        </div>

        <!-- Grid de Imóveis -->
        <div id="imoveisGrid" class="row g-4">
            <div class="col-12">
                <div class="empty-state">Carregando imóveis...</div>
            </div>
        </div>
    </div>

    <!-- Modal Detalhes do Imóvel -->
    <div id="modalImovel" class="modal-overlay d-none">
        <div class="modal-card">
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        const API_URL = '/api';
        let imoveis = [];
        let imovelAtual = null;

        $(document).ready(function() {
            checkAuth();
            loadImoveis();

            $('#btnLogout').on('click', handleLogout);
            $('#btnFiltrar, #searchImovel, #filterTipo, #filterFinalidade').on('click change input', filterImoveis);
        });

        function checkAuth() {
            const token = localStorage.getItem('token');
            const userStr = localStorage.getItem('user');
            
            if (!token || !userStr) {
                window.location.href = '/';
                return;
            }
            
            const user = JSON.parse(userStr);
            $('#userName').text(user.name);
            
            // Verificar se é cliente
            if (user.role !== 'client') {
                window.location.href = '/app/dashboard.html';
            }
        }

        function loadImoveis() {
            const token = localStorage.getItem('token');
            setLoading(true);
            $.ajax({
                url: API_URL + '/portal/imoveis',
                method: 'GET',
                cache: false,
                headers: {
                    Authorization: `Bearer ${token}`,
                    'Cache-Control': 'no-cache',
                    Pragma: 'no-cache'
                },
                data: { _ts: Date.now() },
                success: function(response) {
                    const raw = response.data || [];
                    imoveis = raw.map(normalizeImovel);
                    renderImoveis(imoveis);
                },
                error: function() {
                    imoveis = [];
                    renderImoveis([]);
                }
            }).always(function() {
                setLoading(false);
            });
        }

        function setLoading(isLoading) {
            if (isLoading) {
                $('#imoveisGrid').html('<div class="col-12"><div class="empty-state">Carregando imóveis em tempo real...</div></div>');
            }
        }


        function normalizeImovel(item) {
            // Debug: log do item original
            console.log('Item original:', item);
            console.log('valor_venda:', item.valor_venda, 'preco:', item.preco);
            
            // Parse imagens se for string JSON
            let fotos = [];
            if (item.imagens) {
                if (typeof item.imagens === 'string') {
                    try {
                        fotos = JSON.parse(item.imagens);
                    } catch (e) {
                        fotos = [];
                    }
                } else if (Array.isArray(item.imagens)) {
                    fotos = item.imagens;
                }
            } else if (item.fotos) {
                fotos = Array.isArray(item.fotos) ? item.fotos : [];
            }
            
            const normalized = {
                id: item.id,
                titulo: item.titulo || item.codigo || 'Imovel',
                tipo: item.tipo_imovel || item.tipo || 'casa',
                finalidade: item.finalidade_imovel || item.finalidade || 'venda',
                preco: item.valor_venda || item.preco || 0,
                area: item.area_total || item.area || null,
                quartos: item.dormitorios || item.quartos || 0,
                banheiros: item.banheiros || 0,
                endereco: item.logradouro || item.endereco || '',
                descricao: item.descricao || '',
                fotos: fotos,
            };
            
            console.log('Normalizado:', normalized);
            return normalized;
        }

        function getImagemPrincipal(imovel) {
            const fotos = Array.isArray(imovel.fotos) ? imovel.fotos : [];
            if (fotos.length == 0) return null;
            const first = fotos[0];
            if (typeof first === 'string') return first;
            if (first && typeof first === 'object' && first.url) return first.url;
            return null;
        }

        function renderImoveis(data) {
            if (data.length === 0) {
                $('#imoveisGrid').html('<div class="col-12"><div class="empty-state">Nenhum imóvel encontrado</div></div>');
                return;
            }

            const html = data.map(imovel => `
                <div class="col-12 col-md-6 col-lg-4">
                    <div class="card property-card h-100" onclick="showDetails(${imovel.id})">
                        <div class="property-media">
                            ${getImagemPrincipal(imovel) ? `<img src="${getImagemPrincipal(imovel)}" alt="${imovel.titulo}">` : `<div class="d-flex h-100 align-items-center justify-content-center fs-1">${getTipoIcon(imovel.tipo)}</div>`}
                        </div>
                        <div class="card-body d-flex flex-column">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <h3 class="h5 mb-0">${imovel.titulo}</h3>
                                <span class="badge ${imovel.finalidade === 'venda' ? 'badge-sale' : 'badge-rent'}">${imovel.finalidade}</span>
                            </div>
                            <p class="property-location mb-3">📍 ${imovel.endereco}</p>
                            <div class="property-features mb-3">
                                ${imovel.area ? `<span>📐 ${imovel.area}m²</span>` : ''}
                                ${imovel.quartos > 0 ? `<span>🛏️ ${imovel.quartos}</span>` : ''}
                                ${imovel.banheiros > 0 ? `<span>🚿 ${imovel.banheiros}</span>` : ''}
                            </div>
                            <div class="mt-auto d-flex justify-content-between align-items-center pt-3 border-top">
                                <span class="price">R$ ${formatPrice(imovel.preco)}</span>
                                <span class="property-link">Ver detalhes →</span>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');

            $('#imoveisGrid').html(html);
        }

        function filterImoveis() {
            const search = $('#searchImovel').val().toLowerCase();
            const tipo = $('#filterTipo').val();
            const finalidade = $('#filterFinalidade').val();

            const filtered = imoveis.filter(imovel => {
                const matchSearch = !search || 
                    imovel.titulo.toLowerCase().includes(search) ||
                    imovel.endereco.toLowerCase().includes(search) ||
                    imovel.descricao.toLowerCase().includes(search);
                const matchTipo = !tipo || imovel.tipo === tipo;
                const matchFinalidade = !finalidade || imovel.finalidade === finalidade;

                return matchSearch && matchTipo && matchFinalidade;
            });

            renderImoveis(filtered);
        }

        function showDetails(id) {
            imovelAtual = imoveis.find(i => i.id === id);
            if (!imovelAtual) return;

            const content = `
                <div>
                    <div class="modal-header d-flex align-items-start justify-content-between">
                        <div>
                            <div class="text-uppercase small text-muted">#${imovelAtual.id}</div>
                            <h2 class="mb-2">${imovelAtual.titulo}</h2>
                            <div class="text-muted">📍 ${imovelAtual.endereco}</div>
                        </div>
                        <button onclick="closeModal()" class="btn btn-light">✕</button>
                    </div>
                    <div class="property-media">
                        ${getImagemPrincipal(imovelAtual) ? `<img src="${getImagemPrincipal(imovelAtual)}" alt="${imovelAtual.titulo}">` : `<div class="d-flex h-100 align-items-center justify-content-center fs-1">${getTipoIcon(imovelAtual.tipo)}</div>`}
                    </div>
                    <div class="modal-body">
                        <div class="d-flex flex-wrap align-items-center gap-3 mb-4">
                            <span class="price">R$ ${formatPrice(imovelAtual.preco)}</span>
                            ${imovelAtual.finalidade === 'aluguel' ? '<span class="text-muted">/mês</span>' : ''}
                            <span class="badge ${imovelAtual.finalidade === 'venda' ? 'badge-sale' : 'badge-rent'}">${imovelAtual.finalidade}</span>
                        </div>

                        <div class="row g-3 mb-4">
                            ${imovelAtual.area ? `
                                <div class="col-12 col-md-4">
                                    <div class="detail-card">
                                        <div class="fs-3">📐</div>
                                        <div class="text-muted text-uppercase small">Área</div>
                                        <div class="detail-value">${imovelAtual.area}m²</div>
                                    </div>
                                </div>
                            ` : ''}
                            ${imovelAtual.quartos > 0 ? `
                                <div class="col-12 col-md-4">
                                    <div class="detail-card">
                                        <div class="fs-3">🛏️</div>
                                        <div class="text-muted text-uppercase small">Quartos</div>
                                        <div class="detail-value">${imovelAtual.quartos}</div>
                                    </div>
                                </div>
                            ` : ''}
                            ${imovelAtual.banheiros > 0 ? `
                                <div class="col-12 col-md-4">
                                    <div class="detail-card">
                                        <div class="fs-3">🚿</div>
                                        <div class="text-muted text-uppercase small">Banheiros</div>
                                        <div class="detail-value">${imovelAtual.banheiros}</div>
                                    </div>
                                </div>
                            ` : ''}
                        </div>

                        <div class="mb-4">
                            <h3 class="h5 mb-2">Descrição</h3>
                            <p class="text-muted">${imovelAtual.descricao || 'Descrição não disponível.'}</p>
                        </div>

                        <div class="action-buttons">
                            <button onclick="demonstrarInteresse()" class="btn btn-portal flex-grow-1">
                                💬 Tenho Interesse
                            </button>
                            <button onclick="compartilhar()" class="btn btn-portal-outline flex-grow-1">
                                🔗 Compartilhar
                            </button>
                        </div>
                    </div>
                </div>
            `;

            $('#modalContent').html(content);
            $('#modalImovel').removeClass('d-none');
        }

        function closeModal() {
            $('#modalImovel').addClass('d-none');
        }

        function demonstrarInteresse() {
            const token = localStorage.getItem('token');
            const user = JSON.parse(localStorage.getItem('user'));
            
            $.ajax({
                url: API_URL + '/portal/interesse',
                method: 'POST',
                                contentType: 'application/json',
                data: JSON.stringify({
                    property_id: imovelAtual.id,
                    mensagem: 'Tenho interesse neste imóvel'
                }),
                success: function() {
                    alert('✅ Interesse registrado! Em breve um corretor entrará em contato.');
                    closeModal();
                },
                error: function() {
                    alert('✅ Interesse registrado! (simulado)');
                    closeModal();
                }
            });
        }

        function compartilhar() {
            const url = window.location.href;
            navigator.clipboard.writeText(url);
            alert('🔗 Link copiado para a área de transferência!');
        }

        function getTipoIcon(tipo) {
            const icons = {
                'apartamento': '🏢',
                'terreno': '🏞️',
                'comercial': '🏪'
            };
            return icons[tipo] || '🏘️';
        }

        function formatPrice(price) {
            return price.toLocaleString('pt-BR', { minimumFractionDigits: 2 });
        }

        function handleLogout() {
            localStorage.clear();
            window.location.href = '/';
        }

        // Fechar modal ao clicar fora
        $('#modalImovel').on('click', function(e) {
            if (e.target.id === 'modalImovel') {
                closeModal();
            }
        });
    </script>
</body>
</html>
