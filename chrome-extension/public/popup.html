<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Socimob Atendimento 360</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #f5f5f5;
      color: #333;
    }

    .container {
      padding: 16px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
    }

    .logout-btn {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }

    .logout-btn:hover {
      background: #c0392b;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group label {
      font-size: 12px;
      font-weight: 500;
    }

    .form-group input {
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 12px;
    }

    .login-btn {
      background: #25d366;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    .login-btn:hover {
      background: #1fa857;
    }

    .status {
      padding: 12px;
      border-radius: 4px;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .status.info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }

    .open-panel-btn {
      background: #3498db;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      width: 100%;
    }

    .open-panel-btn:hover {
      background: #2980b9;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Socimob</h1>
      <button class="logout-btn" id="logoutBtn" style="display: none;">Sair</button>
    </div>

    <div id="statusMessage"></div>

    <div id="loginSection" class="login-form">
      <div class="form-group">
        <label for="socimobUrl">URL do Socimob:</label>
        <input type="text" id="socimobUrl" placeholder="https://seu-dominio.com" />
      </div>
      <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="seu@email.com" />
      </div>
      <div class="form-group">
        <label for="password">Senha:</label>
        <input type="password" id="password" placeholder="Sua senha" />
      </div>
      <button class="login-btn" id="loginBtn">Conectar ao Socimob</button>
    </div>

    <div id="authenticatedSection" style="display: none;">
      <p id="userEmail" style="font-size: 12px; margin-bottom: 12px;"></p>
      <button class="open-panel-btn" id="openPanelBtn">Abrir Painel Lateral</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
