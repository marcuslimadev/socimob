<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Imóvel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/app/js/toast.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#1e293b}
        .back-btn{position:fixed;top:20px;left:20px;background:#fff;color:#1e293b;border:none;padding:12px 24px;border-radius:50px;font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.1);z-index:1000;transition:all .2s;cursor:pointer}
        .back-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.15);color:#0ea5e9}
        .detail-container{max-width:1400px;margin:0 auto;padding:100px 20px 60px}
        .image-gallery{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 4px 6px rgba(0,0,0,.07);margin-bottom:30px}
        .main-image{width:100%;height:500px;object-fit:cover;background:#f1f5f9}
        .thumbnail-row{display:flex;gap:10px;padding:15px;background:#f8fafc;overflow-x:auto}
        .thumbnail{width:100px;height:70px;object-fit:cover;border-radius:8px;cursor:pointer;border:3px solid transparent;transition:all .2s;flex-shrink:0}
        .thumbnail:hover{border-color:#0ea5e9}
        .thumbnail.active{border-color:#0ea5e9}
        .property-header{background:#fff;padding:40px;border-radius:20px;box-shadow:0 4px 6px rgba(0,0,0,.07);margin-bottom:30px}
        .property-badge{display:inline-block;background:#0ea5e9;color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:20px}
        .property-badge.rent{background:#8b5cf6}
        .property-title{font-size:2.5rem;font-weight:800;color:#0f172a;margin-bottom:15px;line-height:1.2}
        .property-location{font-size:1.125rem;color:#64748b;margin-bottom:30px;display:flex;align-items:center;gap:8px}
        .property-price{font-size:3rem;font-weight:800;color:#0ea5e9;margin-bottom:30px}
        .features-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-bottom:30px}
        .feature-card{background:#f8fafc;padding:30px;border-radius:16px;text-align:center;transition:all .3s}
        .feature-card:hover{background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.08);transform:translateY(-4px)}
        .feature-icon{font-size:2.5rem;margin-bottom:15px}
        .feature-label{font-size:.875rem;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
        .feature-value{font-size:1.5rem;font-weight:700;color:#0f172a}
        .description-section{background:#fff;padding:40px;border-radius:20px;box-shadow:0 4px 6px rgba(0,0,0,.07);margin-bottom:30px}
        .section-title{font-size:1.75rem;font-weight:700;color:#0f172a;margin-bottom:20px}
        .description-text{font-size:1.125rem;line-height:1.8;color:#475569}
        .map-section{background:#fff;padding:40px;border-radius:20px;box-shadow:0 4px 6px rgba(0,0,0,.07);margin-bottom:30px}
        .map-container{height:400px;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1)}
        .action-buttons{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-top:30px}
        .btn-action{padding:18px 32px;border-radius:12px;font-weight:600;font-size:1.125rem;border:none;transition:all .3s;cursor:pointer}
        .btn-primary-action{background:linear-gradient(135deg,#0ea5e9 0%,#06b6d4 100%);color:#fff}
        .btn-primary-action:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(14,165,233,.3)}
        .btn-secondary-action{background:#fff;color:#0f172a;border:2px solid #e2e8f0}
        .btn-secondary-action:hover{border-color:#0ea5e9;color:#0ea5e9}
        .chat-toggle{position:fixed;bottom:30px;right:30px;width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#0ea5e9 0%,#06b6d4 100%);border:none;color:#fff;font-size:24px;box-shadow:0 4px 20px rgba(14,165,233,.4);cursor:pointer;z-index:999;transition:all .3s}
        .chat-toggle:hover{transform:scale(1.1)}
        .chat-widget{position:fixed;bottom:100px;right:30px;width:380px;height:500px;background:#fff;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.2);display:none;flex-direction:column;z-index:999}
        .chat-widget.open{display:flex}
        .chat-header{background:linear-gradient(135deg,#0ea5e9 0%,#06b6d4 100%);color:#fff;padding:20px;border-radius:20px 20px 0 0}
        .chat-messages{flex:1;padding:20px;overflow-y:auto;background:#f8fafc}
        .chat-message{margin-bottom:15px;display:flex;gap:10px}
        .message-bubble{max-width:70%;padding:12px 16px;border-radius:16px;line-height:1.5}
        .message-bubble.bot{background:#fff;color:#1e293b;border:1px solid #e2e8f0}
        .message-bubble.user{background:#0ea5e9;color:#fff;margin-left:auto}
        .chat-input{padding:20px;border-top:1px solid #e2e8f0;display:flex;gap:10px}
        .chat-input input{flex:1;border:2px solid #e2e8f0;border-radius:12px;padding:12px 16px;font-size:15px}
        .chat-input input:focus{outline:none;border-color:#0ea5e9}
        .chat-input button{background:#0ea5e9;color:#fff;border:none;padding:12px 24px;border-radius:12px;font-weight:600;cursor:pointer}
        @media (max-width:768px){.property-title{font-size:1.75rem}.property-price{font-size:2rem}.main-image{height:300px}.chat-widget{width:calc(100% - 40px);right:20px;left:20px}}
    </style>
</head>
<body>
    <button class="back-btn" onclick="window.location.href='/portal/'">← Voltar</button>
    
    <div class="detail-container">
        <div class="image-gallery">
            <img id="mainImage" class="main-image" src="" alt="Imóvel">
            <div id="thumbnailRow" class="thumbnail-row"></div>
        </div>
        <div class="property-header">
            <span id="finalidadeBadge" class="property-badge">VENDA</span>
            <h1 id="imovelTitulo" class="property-title">Carregando...</h1>
            <div class="property-location"><i class="bi bi-geo-alt-fill"></i><span id="imovelEndereco">...</span></div>
            <div class="property-price">R$ <span id="priceValue">0,00</span></div>
            <div class="features-grid">
                <div class="feature-card"><div class="feature-icon">📐</div><div class="feature-label">Área</div><div class="feature-value"><span id="detailArea">--</span>m²</div></div>
                <div class="feature-card"><div class="feature-icon">🛏️</div><div class="feature-label">Quartos</div><div class="feature-value" id="detailQuartos">--</div></div>
                <div class="feature-card"><div class="feature-icon">🚿</div><div class="feature-label">Banheiros</div><div class="feature-value" id="detailBanheiros">--</div></div>
                <div class="feature-card"><div class="feature-icon">🚗</div><div class="feature-label">Vagas</div><div class="feature-value" id="detailVagas">--</div></div>
            </div>
            <div class="action-buttons">
                <button class="btn-action btn-primary-action" onclick="abrirChat()">💬 Fale Conosco</button>
                <button class="btn-action btn-secondary-action" onclick="compartilhar()">📤 Compartilhar</button>
            </div>
        </div>
        <div class="description-section"><h2 class="section-title">📝 Descrição</h2><div id="imovelDescricao" class="description-text">...</div></div>
        <div class="map-section"><h2 class="section-title">📍 Localização</h2><div id="map" class="map-container"></div></div>
    </div>
    <button class="chat-toggle" onclick="toggleChat()">💬</button>
    <div id="chatWidget" class="chat-widget">
        <div class="chat-header"><h5 class="mb-0 fw-bold">Atendimento IA</h5><small>Online</small></div>
        <div id="chatMessages" class="chat-messages"></div>
        <div class="chat-input"><input type="text" id="chatInput" placeholder="Digite..."/><button onclick="enviarMensagem()">Enviar</button></div>
    </div>
    <script>
        const API_URL="/api";let imovelData=null;let map=null;const urlParams=new URLSearchParams(window.location.search);const imovelId=urlParams.get("id");if(!imovelId)window.location.href="/portal/";async function carregarImovel(){try{const r=await $.ajax({url:`${API_URL}/portal/imoveis/${imovelId}`,method:"GET"});imovelData=r.data||r;renderizarImovel(imovelData);inicializarMapa(imovelData)}catch(e){console.error(e);showToast("Erro ao carregar","error");setTimeout(()=>window.location.href="/portal/",2e3)}}function renderizarImovel(i){$("#imovelTitulo").text(i.titulo||"Imóvel");$("#imovelEndereco").text(i.endereco||"...");const f=(i.finalidade||"venda").toLowerCase();$("#finalidadeBadge").text(f.toUpperCase()).toggleClass("rent",f==="aluguel");$("#priceValue").text(formatPrice(i.preco));$("#detailArea").text(i.area||"--");$("#detailQuartos").text(i.quartos||"--");$("#detailBanheiros").text(i.banheiros||"--");$("#detailVagas").text(i.vagas||"--");$("#imovelDescricao").html(i.descricao||"...");const imgs=getImagens(i);if(imgs.length>0){$("#mainImage").attr("src",imgs[0]);if(imgs.length>1)$("#thumbnailRow").html(imgs.map((img,idx)=>`<img src="${img}" class="thumbnail ${idx===0?"active":""}" onclick="trocarImagem(${idx})">`).join(""))}else $("#mainImage").attr("src","data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='800' height='600'><rect fill='%23f1f5f9' width='800' height='600'/><text x='50%' y='50%' text-anchor='middle' fill='%2364748b' font-size='32'>Sem imagem</text></svg>")}window.trocarImagem=function(idx){const imgs=getImagens(imovelData);$("#mainImage").attr("src",imgs[idx]);$(".thumbnail").removeClass("active").eq(idx).addClass("active")};function getImagens(i){const imgs=[];if(i.fotos&&Array.isArray(i.fotos))imgs.push(...i.fotos);if(i.imagem_principal)imgs.push(i.imagem_principal);if(i.imagem1)imgs.push(i.imagem1);if(i.imagem2)imgs.push(i.imagem2);if(i.imagem3)imgs.push(i.imagem3);return[...new Set(imgs)].filter(Boolean)}function inicializarMapa(i){const lat=i.latitude||i.lat||-15.7801;const lng=i.longitude||i.lng||-47.9292;map=L.map("map").setView([lat,lng],15);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap"}).addTo(map);L.marker([lat,lng]).addTo(map).bindPopup(`<b>${i.titulo}</b><br>${i.endereco}`).openPopup()}function formatPrice(p){if(!p)return"0,00";return Number(p).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}window.toggleChat=function(){$("#chatWidget").toggleClass("open")};window.abrirChat=function(){$("#chatWidget").addClass("open");adicionarMensagem("bot",`Olá! Tenho interesse em ${imovelData?.titulo}. Como posso agendar uma visita?`)};window.enviarMensagem=function(){const input=$("#chatInput");const msg=input.val().trim();if(!msg)return;adicionarMensagem("user",msg);input.val("");setTimeout(()=>adicionarMensagem("bot","Obrigado! Nossa equipe responderá em breve."),1e3)};function adicionarMensagem(tipo,texto){const html=`<div class="chat-message"><div class="message-bubble ${tipo}">${texto}</div></div>`;$("#chatMessages").append(html);$("#chatMessages").scrollTop($("#chatMessages")[0].scrollHeight)}window.compartilhar=async function(){const data={title:imovelData?.titulo||"Imóvel",text:`Confira: ${imovelData?.titulo}`,url:window.location.href};try{if(navigator.share)await navigator.share(data);else{navigator.clipboard.writeText(window.location.href);showToast("Link copiado!","success")}}catch(e){console.log(e)}};$(document).ready(()=>{carregarImovel()});
    </script>
</body>
</html>
