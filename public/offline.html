<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#001775" />
    <title>SOCIMOB offline</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        align-items: center;
        background: #0f172a;
        color: #f8fafc;
        display: flex;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
      }

      main {
        margin: 0 auto;
        max-width: 440px;
      }

      h1 {
        font-size: 1.75rem;
        line-height: 1.1;
        margin: 0 0 12px;
      }

      p {
        color: #cbd5e1;
        font-size: 1rem;
        line-height: 1.6;
        margin: 0 0 20px;
      }

      button {
        background: #2563eb;
        border: 0;
        border-radius: 12px;
        color: #fff;
        font: inherit;
        font-weight: 700;
        min-height: 48px;
        padding: 12px 18px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sem conexão no momento</h1>
      <p>O SOCIMOB já está instalado neste aparelho. Assim que a internet voltar, toque para carregar os dados atualizados.</p>
      <button type="button" onclick="window.location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
