<!DOCTYPE HTML>
<html lang="pt-BR">
	<head>
		<title id="page-title">Portal de Imóveis</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>
		<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	</head>
	<body class="is-preload">

		<!-- Page Wrapper -->
			<div id="page-wrapper">

				<!-- Wrapper -->
					<div id="wrapper">

						<!-- Panel (Banner) -->
							<section class="panel banner right">
								<div class="content color0 span-3-75">
									<h1 class="major" id="tenant-name">Carregando...</h1>
									<p id="tenant-slogan">Encontre o imóvel dos seus sonhos</p>
									<ul class="actions">
										<li><a href="#first" class="button primary color1 circle icon solid fa-angle-right">Ver Imóveis</a></li>
									</ul>
								</div>
								<div class="image filtered span-1-75" data-position="25% 25%">
									<img src="ethereal-images/pic01.jpg" alt="" id="banner-image" />
								</div>
							</section>

						<!-- Panel (Properties Grid) -->
							<section class="panel" id="first">
								<div class="intro color2">
									<h2 class="major">Imóveis Disponíveis</h2>
									<p>Explore nossa seleção de imóveis exclusivos</p>
								</div>
								<div class="gallery" id="properties-gallery">
									<!-- Properties will be loaded here -->
									<div class="intro joined">
										<p>Carregando imóveis...</p>
									</div>
								</div>
							</section>

						<!-- Panel (Contact) -->
							<section class="panel color4-alt">
								<div class="intro color4">
									<h2 class="major">Entre em Contato</h2>
									<p>Tem dúvidas? Nossa equipe está pronta para atendê-lo</p>
								</div>
								<div class="inner columns divided">
									<div class="span-3-25">
										<form id="contact-form">
											<div class="fields">
												<div class="field half">
													<label for="name">Nome</label>
													<input type="text" name="name" id="name" required />
												</div>
												<div class="field half">
													<label for="email">Email</label>
													<input type="email" name="email" id="email" required />
												</div>
												<div class="field half">
													<label for="phone">Telefone</label>
													<input type="tel" name="phone" id="phone" />
												</div>
												<div class="field half">
													<label for="subject">Assunto</label>
													<input type="text" name="subject" id="subject" />
												</div>
												<div class="field">
													<label for="message">Mensagem</label>
													<textarea name="message" id="message" rows="4" required></textarea>
												</div>
											</div>
											<ul class="actions">
												<li><input type="submit" value="Enviar Mensagem" class="button primary" /></li>
											</ul>
										</form>
									</div>
									<div class="span-1-5">
										<ul class="contact-icons color1" id="contact-info">
											<!-- Contact info will be loaded here -->
										</ul>
									</div>
								</div>
							</section>

						<!-- Copyright -->
							<div class="copyright" id="copyright">
								&copy; <span id="current-year"></span> <span id="footer-tenant-name"></span>
							</div>

					</div>

			</div>

		<!-- Scripts -->
			<script src="assets/js/browser.min.js"></script>
			<script src="assets/js/breakpoints.min.js"></script>
			<script src="assets/js/main.js"></script>
			
			<script>
				const API_BASE = window.location.origin;
				let tenantConfig = null;
				let properties = [];

				// Set current year
				document.getElementById('current-year').textContent = new Date().getFullYear();

				// Load tenant config
				async function loadTenantConfig() {
					try {
						const response = await fetch(`${API_BASE}/api/portal/config`);
						const data = await response.json();
						
						if (data.tenant) {
							tenantConfig = data.tenant;
							
							// Update page title and header
							document.getElementById('page-title').textContent = `${data.tenant.name} - Portal de Imóveis`;
							document.getElementById('tenant-name').textContent = data.tenant.name;
							document.getElementById('footer-tenant-name').textContent = data.tenant.name;
							
							if (data.tenant.slogan) {
								document.getElementById('tenant-slogan').textContent = data.tenant.slogan;
							}
							
							// Update contact info
							const contactHtml = `
								${data.tenant.contact_phone ? `<li class="icon solid fa-phone"><a href="tel:${data.tenant.contact_phone.replace('whatsapp:', '')}">${data.tenant.contact_phone.replace('whatsapp:', '')}</a></li>` : ''}
								${data.tenant.contact_email ? `<li class="icon solid fa-envelope"><a href="mailto:${data.tenant.contact_email}">${data.tenant.contact_email}</a></li>` : ''}
								${data.tenant.domain ? `<li class="icon solid fa-globe"><a href="http://${data.tenant.domain}" target="_blank">${data.tenant.domain}</a></li>` : ''}
							`;
							document.getElementById('contact-info').innerHTML = contactHtml;
						}
					} catch (error) {
						console.error('Error loading tenant config:', error);
					}
				}

				// Load properties
				async function loadProperties() {
					try {
						const response = await fetch(`${API_BASE}/api/portal/imoveis`);
						const data = await response.json();
						
						if (data.success && data.data) {
							properties = data.data;
							displayProperties(properties.slice(0, 12)); // Show first 12
						}
					} catch (error) {
						console.error('Error loading properties:', error);
					}
				}

				// Display properties
				function displayProperties(items) {
					if (!items || items.length === 0) {
						document.getElementById('properties-gallery').innerHTML = `
							<div class="intro joined">
								<p>Nenhum imóvel disponível no momento.</p>
							</div>
						`;
						return;
					}

					const galleryHtml = items.map((property, index) => {
						const image = property.imagens && property.imagens.length > 0 
							? property.imagens[0] 
							: 'ethereal-images/pic01.jpg';
						
						const price = property.valor_venda 
							? new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(property.valor_venda)
							: 'Consulte';
						
						const spans = [
							'span-3', 'span-1-5', 'span-1-5', 'span-2-5',
							'span-3', 'span-1-5', 'span-1-5', 'span-3',
							'span-2-5', 'span-3', 'span-1-5', 'span-1-5'
						];
						
						return `
							<a href="imovel.html?id=${property.id}" class="image filtered ${spans[index % spans.length]}" data-position="center">
								<img src="${image}" alt="${property.titulo}" onerror="this.src='ethereal-images/pic01.jpg'" />
								<div class="property-overlay">
									<h3>${property.titulo}</h3>
									<p class="price">${price}</p>
									<p class="location">${property.cidade || ''} - ${property.estado || ''}</p>
								</div>
							</a>
						`;
					}).join('');

					document.getElementById('properties-gallery').innerHTML = galleryHtml;
				}

				// Load data on page load
				document.addEventListener('DOMContentLoaded', function() {
					loadTenantConfig();
					loadProperties();
				});

				// Handle contact form
				document.getElementById('contact-form').addEventListener('submit', function(e) {
					e.preventDefault();
					alert('Mensagem enviada com sucesso! Entraremos em contato em breve.');
					this.reset();
				});
			</script>

			<style>
				/* Custom styles for property overlays */
				.property-overlay {
					position: absolute;
					bottom: 0;
					left: 0;
					right: 0;
					background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
					padding: 2rem 1.5rem;
					color: white;
					opacity: 0;
					transition: opacity 0.3s ease;
				}

				.image:hover .property-overlay {
					opacity: 1;
				}

				.property-overlay h3 {
					font-size: 1rem;
					margin-bottom: 0.5rem;
					text-transform: none;
					font-weight: 600;
					letter-spacing: 0.025em;
				}

				.property-overlay .price {
					font-size: 1.25rem;
					font-weight: 700;
					margin-bottom: 0.25rem;
					color: #fff;
				}

				.property-overlay .location {
					font-size: 0.75rem;
					opacity: 0.8;
					text-transform: uppercase;
					letter-spacing: 0.1em;
				}
			</style>

	</body>
</html>
