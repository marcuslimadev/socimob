<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Visitas - Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/glow.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="/app/js/toast.js"></script>
</head>
<body class="glow-page">
    <nav class="glow-nav">
        <div class="container mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-4">
                    <h1 class="text-2xl font-bold uppercase tracking-tight">Minhas Visitas</h1>
                </div>
                <div class="flex gap-4">
                    <a href="/portal/" class="glow-button ghost">Voltar ao Portal</a>
                    <button id="btnLogout" class="glow-button">Sair</button>
                </div>
            </div>
        </div>
    </nav>

    <section class="py-16">
        <div class="container mx-auto px-4">
            <h2 class="text-3xl font-black text-gray-500 uppercase mb-8">Visitas Agendadas</h2>
            
            <div id="visitasContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="col-span-full text-center py-12 text-gray-500">
                    <div class="animate-pulse">Carregando visitas...</div>
                </div>
            </div>
        </div>
    </section>

    <script>
        const API_URL = '/api';
        let token = localStorage.getItem('portal_token');

        $(document).ready(function() {
            if (!token) {
                window.location.href = '/portal/';
                return;
            }

            loadVisitas();

            $('#btnLogout').on('click', function() {
                localStorage.removeItem('portal_token');
                window.location.href = '/portal/';
            });
        });

        async function loadVisitas() {
            try {
                const response = await $.ajax({
                    url: `${API_URL}/portal/visitas`,
                    method: 'GET',
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (response.success && response.data) {
                    renderVisitas(response.data);
                } else {
                    $('#visitasContainer').html('<div class="col-span-full text-center py-12 text-gray-500">Nenhuma visita agendada.</div>');
                }
            } catch (error) {
                console.error('Erro ao carregar visitas:', error);
                $('#visitasContainer').html('<div class="col-span-full text-center py-12 text-red-500">Erro ao carregar visitas.</div>');
            }
        }

        function renderVisitas(visitas) {
            if (!visitas || visitas.length === 0) {
                $('#visitasContainer').html('<div class="col-span-full text-center py-12 text-gray-500">Você ainda não agendou nenhuma visita.</div>');
                return;
            }

            const html = visitas.map(visita => `
                <div class="bg-white rounded-lg border-4 border-gray-200 p-6 shadow-lg">
                    <div class="mb-4">
                        <h3 class="text-xl font-bold text-gray-900 mb-2">${visita.imovel_titulo || 'Imóvel'}</h3>
                        <p class="text-gray-600">${visita.imovel_endereco || ''}</p>
                    </div>
                    <div class="space-y-2 text-sm">
                        <p><strong>Data:</strong> ${formatarData(visita.data_visita)}</p>
                        <p><strong>Horário:</strong> ${visita.horario_visita || 'A combinar'}</p>
                        <p><strong>Status:</strong> <span class="px-2 py-1 rounded ${getStatusClass(visita.status)}">${getStatusLabel(visita.status)}</span></p>
                    </div>
                    ${visita.observacoes ? `<p class="mt-4 text-sm text-gray-600"><strong>Observações:</strong> ${visita.observacoes}</p>` : ''}
                </div>
            `).join('');

            $('#visitasContainer').html(html);
        }

        function formatarData(data) {
            if (!data) return '';
            const d = new Date(data);
            return d.toLocaleDateString('pt-BR');
        }

        function getStatusClass(status) {
            const classes = {
                'pendente': 'bg-yellow-100 text-yellow-800',
                'confirmada': 'bg-green-100 text-green-800',
                'cancelada': 'bg-red-100 text-red-800',
                'realizada': 'bg-blue-100 text-blue-800'
            };
            return classes[status] || 'bg-gray-100 text-gray-800';
        }

        function getStatusLabel(status) {
            const labels = {
                'pendente': 'Pendente',
                'confirmada': 'Confirmada',
                'cancelada': 'Cancelada',
                'realizada': 'Realizada'
            };
            return labels[status] || status;
        }
    </script>
</body>
</html>
