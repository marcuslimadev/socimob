    <script>
      (() => {
        const host = window.location.hostname.toLowerCase();
        const exclusivaHosts = new Set([
          "exclusivalarimoveis.com",
          "www.exclusivalarimoveis.com",
          "exclusivalarimoveis.com.br",
          "www.exclusivalarimoveis.com.br",
          "exclusivarlarimoveis.com",
          "www.exclusivarlarimoveis.com"
        ]);
        if (!exclusivaHosts.has(host) || !["/", "/portal"].includes(window.location.pathname)) return;

        const title = "Exclusiva Lar Imóveis | Comprar e Alugar em Belo Horizonte";
        const description = "Encontre apartamentos, casas e imóveis para comprar ou alugar em Belo Horizonte. Consulte ofertas atualizadas e fale com a Exclusiva Lar Imóveis.";
        const canonical = "https://exclusivalarimoveis.com/";
        const image = "https://exclusivalarimoveis.com/images/og-exclusiva.png";
        const setMeta = (selector, attribute, key, content) => {
          const element = document.head.querySelector(selector) || document.createElement("meta");
          element.setAttribute(attribute, key);
          element.setAttribute("content", content);
          if (!element.parentNode) document.head.appendChild(element);
        };

        document.title = title;
        document.querySelector("meta[name='application-name']")?.setAttribute("content", "Exclusiva Lar Imóveis");
        document.querySelector("meta[name='apple-mobile-web-app-title']")?.setAttribute("content", "Exclusiva Lar");
        document.querySelector("meta[name='author']")?.setAttribute("content", "Exclusiva Lar Imóveis");
        setMeta("meta[name='description']", "name", "description", description);
        setMeta("meta[property='og:site_name']", "property", "og:site_name", "Exclusiva Lar Imóveis");
        setMeta("meta[property='og:title']", "property", "og:title", title);
        setMeta("meta[property='og:description']", "property", "og:description", description);
        setMeta("meta[property='og:url']", "property", "og:url", canonical);
        setMeta("meta[property='og:image']", "property", "og:image", image);
        setMeta("meta[property='og:image:alt']", "property", "og:image:alt", "Exclusiva Lar Imóveis — imóveis em Belo Horizonte");
        setMeta("meta[name='twitter:title']", "name", "twitter:title", title);
        setMeta("meta[name='twitter:description']", "name", "twitter:description", description);
        setMeta("meta[name='twitter:image']", "name", "twitter:image", image);
        setMeta("meta[name='twitter:image:alt']", "name", "twitter:image:alt", "Exclusiva Lar Imóveis — imóveis em Belo Horizonte");

        const canonicalElement = document.head.querySelector("link[rel='canonical']") || document.createElement("link");
        canonicalElement.setAttribute("rel", "canonical");
        canonicalElement.setAttribute("href", canonical);
        if (!canonicalElement.parentNode) document.head.appendChild(canonicalElement);

        const structuredData = document.getElementById("site-structured-data");
        if (structuredData) {
          structuredData.textContent = JSON.stringify({
            "@context": "https://schema.org",

            "image": image,

            "address": { "@type": "PostalAddress", "addressLocality": "Belo Horizonte", "addressRegion": "MG", "addressCountry": "BR" }

        }
