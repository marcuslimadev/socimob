<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Detalhes do Imóvel</title>
    <link id="pageFavicon" rel="icon" href="/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/portal.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/app/js/toast.js"></script>
</head>
<body class="portal-body">
    <button class="back-btn" onclick="window.location.href='/portal/'">
        ← Voltar para Imóveis
    </button>
    
    <div class="container">
        <div class="detail-hero">
            <!-- Galeria de Imagens -->
            <div class="detail-media">
                <img id="mainImage" src="" alt="Imóvel">
                <div class="detail-price">R$ <span id="priceValue">0</span></div>
                <div id="thumbnailStrip" class="thumbnail-strip"></div>
            </div>
            
            <!-- Detalhes -->
            <div class="detail-section">
                <span id="finalidadeBadge" class="detail-badge badge-sale">VENDA</span>
                <h1 id="imovelTitulo" class="display-5 fw-bold mb-3">Carregando...</h1>
                <p id="imovelEndereco" class="fs-5 mb-4 text-muted">
                    <i>📍</i> <span></span>
                </p>
                
                <!-- Cards de Detalhes -->
                <div class="row g-3 mb-4">
                    <div class="col-6 col-md-3">
                        <div class="detail-card">
                            <div class="fs-3">🏠</div>
                            <div class="text-muted text-uppercase small">Área</div>
                            <div class="detail-value"><span id="detailArea">--</span>m²</div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="detail-card">
                            <div class="fs-3">🛏️</div>
                            <div class="text-muted text-uppercase small">Quartos</div>
                            <div class="detail-value" id="detailQuartos">--</div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="detail-card">
                            <div class="fs-3">🚿</div>
                            <div class="text-muted text-uppercase small">Banheiros</div>
                            <div class="detail-value" id="detailBanheiros">--</div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="detail-card">
                            <div class="fs-3">🚗</div>
                            <div class="text-muted text-uppercase small">Vagas</div>
                            <div class="detail-value" id="detailVagas">--</div>
                        </div>
                    </div>
                </div>
                
                <!-- Descrição -->
                <div class="description-box">
                    <h3 class="fw-bold mb-3">📝 Descrição</h3>
                    <div id="imovelDescricao" class="fs-6 lh-lg text-muted">Carregando descrição...</div>
                </div>
                
                <!-- Mapa -->
                <div class="row mt-4">
                    <div class="col-12">
                        <h3 class="fw-bold mb-3">📍 Localização</h3>
                        <div id="map" class="map-container"></div>
                    </div>
                </div>
                
                <!-- Botões de Ação -->
                <div class="action-buttons">
                    <button class="btn btn-portal-outline flex-grow-1" onclick="compartilhar()">
                        📤 Compartilhar
                    </button>
                    <button class="btn btn-portal flex-grow-1" onclick="abrirChat()">
                        💬 Fale Conosco
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Chat Widget -->
    <button class="chat-toggle" onclick="toggleChat()">💬</button>
    
    <div id="chatWidget" class="chat-widget">
        <div class="chat-header text-white p-3 d-flex justify-content-between align-items-center">
            <div>
                <h5 class="mb-0 fw-bold">Atendimento IA</h5>
                <small>Online agora</small>
            </div>
            <button class="btn btn-link text-white" onclick="toggleChat()">✕</button>
        </div>
        <div id="chatMessages" class="chat-messages"></div>
        <div class="chat-input-area">
            <form id="chatForm" onsubmit="enviarMensagem(event)" class="d-flex gap-2">
                <input type="text" id="chatInput" class="form-control" placeholder="Digite sua mensagem..." required>
                <button type="submit" class="btn btn-portal">Enviar</button>
            </form>
        </div>
    </div>
    
    <script>
        const API_URL = '/api';
        let imovelData = null;
        let conversaId = null;
        let map = null;
        
        // Pegar ID do imóvel da URL
        const urlParams = new URLSearchParams(window.location.search);
        const imovelId = urlParams.get('id');
        
        if (!imovelId) {
            window.location.href = '/portal/';
        }
        
        // Carregar dados do imóvel
        async function carregarImovel() {
            try {
                const response = await $.ajax({
                    url: `${API_URL}/portal/imoveis/${imovelId}`,
                    method: 'GET'
                });
                
                imovelData = response.data || response;
                renderizarImovel(imovelData);
                inicializarMapa(imovelData);
            } catch (error) {
                console.error('Erro ao carregar imóvel:', error);
                showToast('Erro ao carregar imóvel', 'error');
                setTimeout(() => window.location.href = '/portal/', 2000);
            }
        }
        
        function renderizarImovel(imovel) {
            // Título e informações básicas
            $('#imovelTitulo').text(imovel.titulo || 'Imóvel');
            $('#imovelEndereco span').text(imovel.endereco || 'Endereço não informado');
            const finalidade = (imovel.finalidade || 'venda').toLowerCase();
            $('#finalidadeBadge')
                .text(finalidade.toUpperCase())
                .removeClass('badge-sale badge-rent')
                .addClass(finalidade === 'aluguel' ? 'badge-rent' : 'badge-sale');
            $('#priceValue').text(formatPrice(imovel.preco));
            
            // Detalhes
            $('#detailArea').text(imovel.area || '--');
            $('#detailQuartos').text(imovel.quartos || '--');
            $('#detailBanheiros').text(imovel.banheiros || '--');
            $('#detailVagas').text(imovel.vagas || '--');
            
            // Descrição
            $('#imovelDescricao').html(imovel.descricao || 'Descrição não disponível.');
            
            // Imagens
            const imagens = getImagens(imovel);
            if (imagens.length > 0) {
                $('#mainImage').attr('src', imagens[0]);
                
                if (imagens.length > 1) {
                    const thumbsHtml = imagens.map((img, idx) => 
                        `<img src="${img}" class="thumbnail ${idx === 0 ? 'active' : ''}" onclick="trocarImagem(${idx})">`
                    ).join('');
                    $('#thumbnailStrip').html(thumbsHtml);
                } else {
                    $('#thumbnailStrip').hide();
                }
            } else {
                $('#mainImage').attr('src', 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600"><rect fill="%23e2e8f0" width="800" height="600"/><text x="50%" y="50%" text-anchor="middle" fill="%2364748b" font-size="48">Sem imagem</text></svg>');
                $('#thumbnailStrip').hide();
            }
        }
        
        window.trocarImagem = function(index) {
            const imagens = getImagens(imovelData);
            $('#mainImage').attr('src', imagens[index]);
            $('.thumbnail').removeClass('active').eq(index).addClass('active');
        };
        
        function getImagens(imovel) {
            const imgs = [];
            if (imovel.fotos && Array.isArray(imovel.fotos)) {
                imgs.push(...imovel.fotos);
            }
            if (imovel.imagem_principal) imgs.push(imovel.imagem_principal);
            if (imovel.imagem1) imgs.push(imovel.imagem1);
            if (imovel.imagem2) imgs.push(imovel.imagem2);
            if (imovel.imagem3) imgs.push(imovel.imagem3);
            return [...new Set(imgs)].filter(Boolean);
        }
        
        function inicializarMapa(imovel) {
            // Coordenadas padrão (centro do Brasil) se não houver lat/lng
            const lat = imovel.latitude || imovel.lat || -15.7801;
            const lng = imovel.longitude || imovel.lng || -47.9292;
            
            map = L.map('map').setView([lat, lng], 15);
            
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);
            
            L.marker([lat, lng]).addTo(map)
                .bindPopup(`<b>${imovel.titulo}</b><br>${imovel.endereco}`)
                .openPopup();
        }
        
        function formatPrice(price) {
            if (!price) return '0,00';
            return Number(price).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
        
        window.toggleChat = function() {
            $('#chatWidget').toggleClass('open');
            if (!conversaId) {
                iniciarConversa();
            }
        };
        
        window.abrirChat = function() {
            $('#chatWidget').addClass('open');
            if (!conversaId) {
                iniciarConversa();
            }
        };
        
        async function iniciarConversa() {
            const token = localStorage.getItem('portal_token');
            if (!token) {
                adicionarMensagem('bot', 'Olá! Como posso ajudar com este imóvel?');
                return;
            }
            
            try {
                const response = await $.ajax({
                    url: `${API_URL}/portal/chat/iniciar`,
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + token },
                    data: JSON.stringify({ imovel_id: imovelId }),
                    contentType: 'application/json'
                });
                
                conversaId = response.conversa_id;
                adicionarMensagem('bot', response.mensagem || 'Olá! Como posso ajudar?');
            } catch (error) {
                console.error('Erro ao iniciar conversa:', error);
                adicionarMensagem('bot', 'Olá! Como posso ajudar com este imóvel?');
            }
        }
        
        window.enviarMensagem = async function(e) {
            e.preventDefault();
            const input = $('#chatInput');
            const mensagem = input.val().trim();
            
            if (!mensagem) return;
            
            adicionarMensagem('user', mensagem);
            input.val('');
            
            const token = localStorage.getItem('portal_token');
            
            try {
                const response = await $.ajax({
                    url: `${API_URL}/portal/chat/mensagem`,
                    method: 'POST',
                    headers: token ? { 'Authorization': 'Bearer ' + token } : {},
                    data: JSON.stringify({ 
                        conversa_id: conversaId,
                        mensagem: mensagem,
                        imovel_id: imovelId
                    }),
                    contentType: 'application/json'
                });
                
                adicionarMensagem('bot', response.resposta || 'Desculpe, não entendi.');
            } catch (error) {
                console.error('Erro ao enviar mensagem:', error);
                adicionarMensagem('bot', 'Desculpe, ocorreu um erro. Tente novamente.');
            }
        };
        
        function adicionarMensagem(tipo, texto) {
            const bubble = $('<div>').addClass(`chat-bubble ${tipo}`).text(texto);
            $('#chatMessages').append(bubble);
            $('#chatMessages').scrollTop($('#chatMessages')[0].scrollHeight);
        }
        
        window.compartilhar = function() {
            if (navigator.share) {
                navigator.share({
                    title: imovelData.titulo,
                    text: `Confira este imóvel: ${imovelData.titulo}`,
                    url: window.location.href
                });
            } else {
                navigator.clipboard.writeText(window.location.href);
                showToast('Link copiado!', 'success');
            }
        };
        
        // Carregar imóvel ao iniciar
        $(document).ready(() => {
            carregarImovel();
        });
    </script>
</body>
</html>
