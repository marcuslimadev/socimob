<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Imóvel - Exclusiva Imóveis</title>

    <!-- Bootstrap 5.3.0 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            color: #1a202c;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .property-header {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.07);
        }

        .loading {
            text-align: center;
            padding: 2rem;
        }

        .error {
            text-align: center;
            padding: 2rem;
            color: #e53e3e;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="/portal/">
                <i class="fas fa-home text-primary"></i>
                Exclusiva Imóveis
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/portal/">Voltar ao Portal</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="property-header">
            <h1 id="property-title">Carregando imóvel...</h1>
            <div id="property-info" class="loading">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Carregando...</span>
                </div>
                <p class="mt-2">Carregando detalhes do imóvel...</p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        function getPropertyId() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('id');
        }

        async function loadProperty() {
            const propertyId = getPropertyId();

            if (!propertyId) {
                document.getElementById('property-info').innerHTML = '<div class="error"><i class="fas fa-exclamation-triangle"></i><p>ID do imóvel não encontrado na URL.</p></div>';
                document.getElementById('property-title').textContent = 'Erro';
                return;
            }

            try {
                console.log('Carregando imóvel ID:', propertyId);
                const response = await fetch(`${API_BASE}/api/portal/imoveis/${propertyId}`);
                const data = await response.json();

                console.log('Resposta da API:', data);

                if (data.success && data.data) {
                    displayProperty(data.data);
                } else {
                    document.getElementById('property-info').innerHTML = '<div class="error"><i class="fas fa-exclamation-triangle"></i><p>Imóvel não encontrado.</p></div>';
                    document.getElementById('property-title').textContent = 'Imóvel não encontrado';
                }
            } catch (error) {
                console.error('Erro ao carregar imóvel:', error);
                document.getElementById('property-info').innerHTML = '<div class="error"><i class="fas fa-exclamation-circle"></i><p>Erro ao carregar imóvel. Verifique o console para mais detalhes.</p></div>';
                document.getElementById('property-title').textContent = 'Erro de carregamento';
            }
        }

        function displayProperty(property) {
            console.log('Exibindo imóvel:', property);

            document.getElementById('property-title').textContent = property.titulo || 'Título não disponível';

            const infoHtml = `
                <div class="row">
                    <div class="col-md-8">
                        <h3>R$ ${property.valor_venda ? property.valor_venda.toLocaleString('pt-BR') : 'Preço não informado'}</h3>
                        <p><i class="fas fa-map-marker-alt"></i> ${property.endereco || ''}, ${property.bairro || ''}, ${property.cidade || ''} - ${property.estado || ''}</p>
                        <p>${property.descricao || 'Descrição não disponível.'}</p>
                    </div>
                    <div class="col-md-4">
                        <div class="card">
                            <div class="card-body text-center">
                                <h5>Características</h5>
                                <p><strong>Quartos:</strong> ${property.dormitorios || 'N/A'}</p>
                                <p><strong>Banheiros:</strong> ${property.banheiros || 'N/A'}</p>
                                <p><strong>Área:</strong> ${property.area_total || 'N/A'} m²</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('property-info').innerHTML = infoHtml;
        }

        // Carregar quando a página estiver pronta
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Página carregada, iniciando carregamento do imóvel...');
            loadProperty();
        });
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --accent-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --text-primary: #1a202c;
            --text-secondary: #718096;
            --bg-light: #f8fafc;
            --bg-white: #ffffff;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.12);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.07);
            --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.1);
            --border-radius: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
            background: var(--bg-light);
            line-height: 1.6;
        }

        /* Header */
        .property-header {
            background: var(--bg-white);
            padding: 2rem 0;
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #667eea;
            text-decoration: none;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn-header {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 500;
            text-decoration: none;
            transition: var(--transition);
        }

        .btn-back {
            background: transparent;
            color: var(--text-secondary);
            border: 2px solid #e2e8f0;
        }

        .btn-back:hover {
            background: var(--text-secondary);
            color: white;
        }

        .btn-like {
            background: transparent;
            color: #e53e3e;
            border: 2px solid #e53e3e;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-like:hover {
            background: #e53e3e;
            color: white;
        }

        .btn-like.liked {
            background: #e53e3e;
            color: white;
        }

        /* Gallery */
        .gallery-section {
            position: relative;
            padding: 2rem 0;
            overflow: hidden;
        }

        .gallery-container {
            position: relative;
            width: 100%;
            overflow: hidden;
        }

        .gallery-track {
            display: flex;
            transition: transform 0.5s ease;
            width: calc(100% / 3 * var(--total-images, 1));
        }

        .gallery-item {
            flex: 0 0 calc(100% / 3);
            padding: 0 0.5rem;
            box-sizing: border-box;
        }

        .gallery-image {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .gallery-image:hover {
            transform: scale(1.05);
        }

        .gallery-nav {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .gallery-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(102, 126, 234, 0.3);
            cursor: pointer;
            transition: var(--transition);
        }

        .gallery-dot.active {
            background: var(--primary-color, #667eea);
        }

        .gallery-arrows {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            z-index: 10;
            box-shadow: var(--shadow-md);
        }

        .gallery-arrows:hover {
            background: white;
            transform: translateY(-50%) scale(1.1);
        }

        .gallery-arrows:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .gallery-prev {
            left: 1rem;
        }

        .gallery-next {
            right: 1rem;
        }

        /* Property Info */
        .property-info-section {
            padding: 3rem 0;
        }

        .property-info-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 3rem;
        }

        .property-main-info {
            background: var(--bg-white);
            padding: 2rem;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
        }

        .property-price {
            font-size: 2.5rem;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 1rem;
        }

        .property-title {
            font-size: 1.75rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 1rem;
        }

        .property-location {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            margin-bottom: 2rem;
            font-size: 1.125rem;
        }

        .property-features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .feature-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 1rem;
            background: var(--bg-light);
            border-radius: 8px;
        }

        .feature-icon {
            font-size: 1.5rem;
            color: #667eea;
            margin-bottom: 0.5rem;
        }

        .feature-value {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .feature-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .property-description {
            margin-bottom: 2rem;
        }

        .description-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        .description-text {
            line-height: 1.7;
            color: var(--text-secondary);
        }

        .property-actions {
            display: flex;
            gap: 1rem;
        }

        .btn-action {
            flex: 1;
            padding: 1rem 2rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            text-align: center;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-contact {
            background: var(--primary-gradient);
            color: white;
        }

        .btn-contact:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .btn-schedule {
            background: transparent;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-schedule:hover {
            background: #667eea;
            color: white;
        }

        /* Sidebar */
        .property-sidebar {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .sidebar-card {
            background: var(--bg-white);
            padding: 2rem;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
        }

        .sidebar-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
        }

        .agent-info {
            text-align: center;
        }

        .agent-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--primary-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2rem;
            margin: 0 auto 1rem;
        }

        .agent-name {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .agent-role {
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        .agent-contact {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .btn-agent-contact {
            width: 100%;
            margin-top: 1rem;
            padding: 0.75rem;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-agent-contact:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        /* Map */
        .map-container {
            height: 300px;
            border-radius: var(--border-radius);
            overflow: hidden;
            background: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Chat Widget */
        .chat-widget {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 350px;
            height: 500px;
            background: var(--bg-white);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-lg);
            display: none;
            flex-direction: column;
            z-index: 1000;
        }

        .chat-header {
            background: var(--primary-gradient);
            color: white;
            padding: 1rem;
            border-radius: var(--border-radius) var(--border-radius) 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-title {
            font-weight: 600;
        }

        .chat-close {
            background: none;
            border: none;
            color: white;
            font-size: 1.25rem;
            cursor: pointer;
        }

        .chat-messages {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .message {
            max-width: 80%;
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 0.875rem;
        }

        .message.sent {
            align-self: flex-end;
            background: var(--primary-gradient);
            color: white;
        }

        .message.received {
            align-self: flex-start;
            background: var(--bg-light);
            color: var(--text-primary);
        }

        .chat-input-area {
            padding: 1rem;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 0.5rem;
        }

        .chat-input {
            flex: 1;
            padding: 0.75rem;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 0.875rem;
        }

        .chat-input:focus {
            border-color: #667eea;
            outline: none;
        }

        .chat-send {
            padding: 0.75rem 1rem;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
        }

        .chat-send:hover {
            transform: translateY(-1px);
        }

        .chat-toggle {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 60px;
            height: 60px;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            transition: var(--transition);
            z-index: 999;
        }

        .chat-toggle:hover {
            transform: scale(1.1);
        }

        /* Loading States */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(102, 126, 234, 0.3);
            border-radius: 50%;
            border-top-color: #667eea;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 1rem;
            }

            .property-info-container {
                grid-template-columns: 1fr;
                gap: 2rem;
            }

            .gallery-item {
                flex: 0 0 100%;
            }

            .gallery-track {
                width: calc(100% * var(--total-images, 1));
            }

            .gallery-image {
                height: 250px;
            }

            .chat-widget {
                width: calc(100vw - 2rem);
                height: calc(100vh - 4rem);
                bottom: 1rem;
                right: 1rem;
            }

            .property-features {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .property-price {
                font-size: 2rem;
            }

            .property-title {
                font-size: 1.5rem;
            }

            .property-actions {
                flex-direction: column;
            }

            .gallery-nav {
                margin-top: 0.5rem;
            }

            .gallery-image {
                height: 200px;
            }
        }

        /* Accessibility */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Focus states */
        .btn:focus,
        .chat-input:focus {
            outline: 2px solid #667eea;
            outline-offset: 2px;
        }

        /* Print styles */
        @media print {
            .property-header,
            .chat-widget,
            .chat-toggle {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="property-header">
        <div class="container">
            <div class="header-content">
                <a href="index.html" class="logo">Exclusiva Imóveis</a>
                <div class="header-actions">
                    <a href="index.html" class="btn-header btn-back">
                        <i class="fas fa-arrow-left"></i> Voltar
                    </a>
                    <button class="btn-header btn-like" id="like-btn">
                        <i class="far fa-heart"></i>
                        Favoritar
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Gallery -->
    <section class="gallery-section">
        <div class="container">
            <div class="gallery-container" id="gallery-container">
                <!-- Images will be loaded here -->
            </div>
            <button class="gallery-arrows gallery-prev" id="gallery-prev">
                <i class="fas fa-chevron-left"></i>
            </button>
            <button class="gallery-arrows gallery-next" id="gallery-next">
                <i class="fas fa-chevron-right"></i>
            </button>
            <div class="gallery-nav" id="gallery-nav"></div>
        </div>
    </section>

    <!-- Property Info -->
    <section class="property-info-section">
        <div class="container">
            <div class="property-info-container">
                <div class="property-main-info" id="property-main-info">
                    <!-- Property details will be loaded here -->
                </div>

                <div class="property-sidebar">
                    <!-- Agent Info -->
                    <div class="sidebar-card">
                        <h3 class="sidebar-title">Corretor Responsável</h3>
                        <div class="agent-info" id="agent-info">
                            <!-- Agent details will be loaded here -->
                        </div>
                    </div>

                    <!-- Map -->
                    <div class="sidebar-card">
                        <h3 class="sidebar-title">Localização</h3>
                        <div class="map-container" id="map-container"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Chat Toggle -->
    <button class="chat-toggle" id="chat-toggle">
        <i class="fas fa-comments"></i>
    </button>

    <!-- Chat Widget -->
    <div class="chat-widget" id="chat-widget">
        <div class="chat-header">
            <span class="chat-title">Chat com Corretor</span>
            <button class="chat-close" id="chat-close">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="chat-messages" id="chat-messages">
            <div class="message received">
                Olá! Estou aqui para ajudar você com este imóvel. Tem alguma dúvida?
            </div>
        </div>
        <div class="chat-input-area">
            <input type="text" class="chat-input" id="chat-input" placeholder="Digite sua mensagem...">
            <button class="chat-send" id="chat-send">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // API Configuration
        const API_BASE = window.location.origin;
        let currentProperty = null;
        let currentImages = [];
        let map = null;

        // Utility Functions
        function formatPrice(price) {
            return new Intl.NumberFormat('pt-BR', {
                style: 'currency',
                currency: 'BRL'
            }).format(price);
        }

        function getPropertyId() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('id');
        }

        function showLoading(element) {
            element.html('<div class="text-center p-4"><div class="loading-spinner"></div><p class="mt-2">Carregando...</p></div>');
        }

        // Gallery Functions
        let currentSlideIndex = 0;
        let totalSlides = 0;
        let currentImages = [];

        function createGallery(images) {
            if (!images || images.length === 0) {
                $('#gallery-container').html('<div class="text-center p-5" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-radius: 12px;"><i class="fas fa-image fa-3x mb-3"></i><h4>Imagem não disponível</h4></div>');
                $('#gallery-nav').hide();
                $('#gallery-prev, #gallery-next').hide();
                return;
            }

            currentImages = images;
            totalSlides = Math.ceil(images.length / 3); // Cada slide mostra 3 imagens
            currentSlideIndex = 0;

            // Criar estrutura do carrossel
            const galleryHtml = `
                <div class="gallery-track" id="gallery-track" style="--total-images: ${images.length}">
                    ${images.map((image, index) => `
                        <div class="gallery-item">
                            <img src="${image}" alt="Imagem ${index + 1}" class="gallery-image" loading="lazy" onclick="openImageModal(${index})">
                        </div>
                    `).join('')}
                </div>
            `;

            $('#gallery-container').html(galleryHtml);
            updateGalleryNav();
            updateArrowStates();

            // Mostrar controles apenas se houver mais de 3 imagens
            if (images.length > 3) {
                $('#gallery-nav').show();
                $('#gallery-prev, #gallery-next').show();
            } else {
                $('#gallery-nav').hide();
                $('#gallery-prev, #gallery-next').hide();
            }
        }

        function updateGalleryNav() {
            if (totalSlides <= 1) {
                $('#gallery-nav').hide();
                return;
            }

            const navHtml = Array.from({length: totalSlides}, (_, index) => `
                <div class="gallery-dot ${index === currentSlideIndex ? 'active' : ''}" data-slide="${index}"></div>
            `).join('');

            $('#gallery-nav').html(navHtml).show();
        }

        function updateArrowStates() {
            $('#gallery-prev').prop('disabled', currentSlideIndex === 0);
            $('#gallery-next').prop('disabled', currentSlideIndex === totalSlides - 1);
        }

        function goToSlide(slideIndex) {
            if (slideIndex < 0 || slideIndex >= totalSlides) return;

            currentSlideIndex = slideIndex;
            const track = document.getElementById('gallery-track');
            const translateX = -(slideIndex * (100 / 3)); // Mover 33.33% por slide (1/3)
            track.style.transform = `translateX(${translateX}%)`;

            updateGalleryNav();
            updateArrowStates();
        }

        function nextSlide() {
            if (currentSlideIndex < totalSlides - 1) {
                goToSlide(currentSlideIndex + 1);
            }
        }

        function prevSlide() {
            if (currentSlideIndex > 0) {
                goToSlide(currentSlideIndex - 1);
            }
        }

        function openImageModal(imageIndex) {
            // Implementar modal de imagem se necessário
            console.log('Abrir modal para imagem:', imageIndex);
        }

        // Property Display
        function displayProperty(property) {
            if (!property) {
                console.error('Property data is undefined');
                $('#property-main-info').html('<div class="text-center p-4"><p class="text-danger">Dados do imóvel não encontrados.</p></div>');
                return;
            }
            
            currentProperty = property;

            const mainInfoHtml = `
                <div class="property-price">${formatPrice(property.valor_venda || property.preco)}</div>
                <h1 class="property-title">${property.titulo}</h1>
                <div class="property-location">
                    <i class="fas fa-map-marker-alt"></i>
                    ${property.endereco}, ${property.bairro}, ${property.cidade} - ${property.estado}
                </div>

                <div class="property-features">
                    ${property.dormitorios ? `
                        <div class="feature-item">
                            <div class="feature-icon"><i class="fas fa-bed"></i></div>
                            <div class="feature-value">${property.dormitorios}</div>
                            <div class="feature-label">Quartos</div>
                        </div>
                    ` : ''}
                    ${property.banheiros ? `
                        <div class="feature-item">
                            <div class="feature-icon"><i class="fas fa-bath"></i></div>
                            <div class="feature-value">${property.banheiros}</div>
                            <div class="feature-label">Banheiros</div>
                        </div>
                    ` : ''}
                    ${property.vagas ? `
                        <div class="feature-item">
                            <div class="feature-icon"><i class="fas fa-car"></i></div>
                            <div class="feature-value">${property.vagas}</div>
                            <div class="feature-label">Vagas</div>
                        </div>
                    ` : ''}
                    ${property.area_total ? `
                        <div class="feature-item">
                            <div class="feature-icon"><i class="fas fa-ruler-combined"></i></div>
                            <div class="feature-value">${property.area_total}</div>
                            <div class="feature-label">m²</div>
                        </div>
                    ` : ''}
                </div>

                <div class="property-description">
                    <h3 class="description-title">Descrição</h3>
                    <div class="description-text">${property.descricao || 'Descrição não disponível.'}</div>
                </div>

                <div class="property-actions">
                    <button class="btn-action btn-contact" onclick="contactAgent()">
                        <i class="fas fa-phone"></i>
                        Entrar em Contato
                    </button>
                    <button class="btn-action btn-schedule" onclick="scheduleVisit()">
                        <i class="fas fa-calendar"></i>
                        Agendar Visita
                    </button>
                </div>
            `;

            $('#property-main-info').html(mainInfoHtml);
            createGallery(property.imagens);

            // Initialize map if coordinates available
            if (property.latitude && property.longitude) {
                // Small delay to ensure DOM is ready
                setTimeout(() => {
                    initializeMap(property.latitude, property.longitude);
                }, 100);
            }
        }

        function displayAgent(agent) {
            if (!agent) {
                agent = {};
            }
            
            const agentHtml = `
                <div class="agent-avatar">
                    <i class="fas fa-user"></i>
                </div>
                <div class="agent-name">${agent.nome || 'Corretor'}</div>
                <div class="agent-role">Corretor de Imóveis</div>
                <div class="agent-contact">
                    ${agent.telefone ? `<div class="contact-item"><i class="fas fa-phone"></i> ${agent.telefone}</div>` : ''}
                    ${agent.email ? `<div class="contact-item"><i class="fas fa-envelope"></i> ${agent.email}</div>` : ''}
                </div>
                <button class="btn-agent-contact" onclick="startChat()">
                    <i class="fas fa-comments"></i>
                    Iniciar Conversa
                </button>
            `;

            $('#agent-info').html(agentHtml);
        }

        // Map Functions
        function initializeMap(lat, lng) {
            try {
                // Validate coordinates
                lat = parseFloat(lat);
                lng = parseFloat(lng);
                
                if (isNaN(lat) || isNaN(lng) || lat < -90 || lat > 90 || lng < -180 || lng > 180) {
                    console.warn('Invalid coordinates for map:', lat, lng);
                    $('#map-container').html('<div class="text-center p-4" style="background: #f8f9fa; border-radius: 12px;"><i class="fas fa-map-marked-alt text-muted" style="font-size: 2rem;"></i><p class="mt-2 text-muted">Localização não disponível</p></div>');
                    return;
                }

                if (map) {
                    map.remove();
                }

                map = L.map('map-container').setView([lat, lng], 15);

                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap contributors'
                }).addTo(map);

                L.marker([lat, lng]).addTo(map)
                    .bindPopup(currentProperty.titulo)
                    .openPopup();
                    
                console.log('Map initialized successfully for coordinates:', lat, lng);
            } catch (error) {
                console.error('Error initializing map:', error);
                $('#map-container').html('<div class="text-center p-4" style="background: #f8f9fa; border-radius: 12px;"><i class="fas fa-exclamation-triangle text-warning" style="font-size: 2rem;"></i><p class="mt-2 text-muted">Erro ao carregar mapa</p></div>');
            }
        }

        // Chat Functions
        function toggleChat() {
            $('#chat-widget').toggle();
            $('#chat-toggle').toggle();
        }

        function sendMessage() {
            const input = $('#chat-input');
            const message = input.val().trim();

            if (message) {
                addMessage(message, 'sent');
                input.val('');

                // Simulate response (replace with actual API call)
                setTimeout(() => {
                    addMessage('Obrigado pela mensagem! Entraremos em contato em breve.', 'received');
                }, 1000);
            }
        }

        function addMessage(text, type) {
            const messageHtml = `<div class="message ${type}">${text}</div>`;
            $('#chat-messages').append(messageHtml);
            $('#chat-messages').scrollTop($('#chat-messages')[0].scrollHeight);
        }

        // Action Functions
        function contactAgent() {
            if (currentProperty && currentProperty.corretor) {
                window.location.href = `tel:${currentProperty.corretor.telefone}`;
            }
        }

        function scheduleVisit() {
            toggleChat();
            addMessage('Olá! Gostaria de agendar uma visita para este imóvel.', 'sent');
        }

        function startChat() {
            toggleChat();
        }

        function toggleLike() {
            const btn = $('#like-btn');
            const icon = btn.find('i');

            if (btn.hasClass('liked')) {
                btn.removeClass('liked');
                icon.removeClass('fas').addClass('far');
                btn.html('<i class="far fa-heart"></i> Favoritar');
            } else {
                btn.addClass('liked');
                icon.removeClass('far').addClass('fas');
                btn.html('<i class="fas fa-heart"></i> Favoritado');
            }
        }

        // API Functions
        async function loadProperty() {
            const propertyId = getPropertyId();

            if (!propertyId) {
                $('#property-main-info').html('<div class="text-center p-4"><p class="text-danger">ID do imóvel não encontrado.</p></div>');
                return;
            }

            showLoading($('#property-main-info'));
            showLoading($('#agent-info'));

            try {
                const response = await fetch(`${API_BASE}/api/portal/imoveis/${propertyId}`);
                const data = await response.json();

                if (data.success) {
                    displayProperty(data.data);
                    displayAgent(data.data.corretor || {});
                } else {
                    $('#property-main-info').html('<div class="text-center p-4"><p class="text-danger">Imóvel não encontrado.</p></div>');
                }
            } catch (error) {
                console.error('Erro ao carregar imóvel:', error);
                $('#property-main-info').html('<div class="text-center p-4"><p class="text-danger">Erro ao carregar imóvel. Tente novamente.</p></div>');
            }
        }

        // Event Listeners
        $(document).ready(function() {
            loadProperty();

            // Gallery navigation
            $('#gallery-prev').on('click', prevSlide);
            $('#gallery-next').on('click', nextSlide);

            $(document).on('click', '.gallery-dot', function() {
                const slideIndex = $(this).data('slide');
                goToSlide(slideIndex);
            });

            // Chat functionality
            $('#chat-toggle').on('click', toggleChat);
            $('#chat-close').on('click', toggleChat);
            $('#chat-send').on('click', sendMessage);
            $('#chat-input').on('keypress', function(e) {
                if (e.which === 13) {
                    sendMessage();
                }
            });

            // Like button
            $('#like-btn').on('click', toggleLike);

            // Keyboard navigation
            $(document).on('keydown', function(e) {
                if (e.key === 'ArrowLeft') {
                    prevImage();
                } else if (e.key === 'ArrowRight') {
                    nextImage();
                } else if (e.key === 'Escape') {
                    $('#chat-widget').hide();
                    $('#chat-toggle').show();
                }
            });
        });
    </script>
</body>
</html>
