<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SOCIMOB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="sidebar.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="bootswatch-themes.js"></script>
</head>
<body>
    <a href="#main-content" class="skip-link">Pular para o conteúdo principal</a>
    <div id="sidebar-container"></div>
    <main id="main-content" class="container py-4">
        <section class="bg-surface rounded-xl shadow-md p-5">
            <div class="mb-4">
                <h2 class="h4 fw-bold text-white mb-1">Dashboard</h2>
                <p class="text-muted mb-0">Visão geral dos leads, imóveis e conversas</p>
            </div>
            <div class="grid grid-cols-3 lg:grid-cols-3 md:grid-cols-2">
                <div class="stat-card">
                    <div class="stat-card-icon stat-card-icon--primary">
                        <i class="bi bi-people-fill" aria-hidden="true"></i>
                    </div>
                    <div class="stat-card-content">
                        <p class="stat-card-label">Leads</p>
                        <h3 id="statLeadsValue" class="stat-card-value">0</h3>
                        <div class="stat-card-footer">
                            <span id="statLeadsDetail" class="stat-card-period">Carregando...</span>
                        </div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-icon stat-card-icon--success">
                        <i class="bi bi-house-fill" aria-hidden="true"></i>
                    </div>
                    <div class="stat-card-content">
                        <p class="stat-card-label">Imóveis</p>
                        <h3 id="statPropertiesValue" class="stat-card-value">0</h3>
                        <div class="stat-card-footer">
                            <span id="statPropertiesDetail" class="stat-card-period">Atualizando...</span>
                        </div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-card-icon stat-card-icon--warning">
                        <i class="bi bi-chat-dots-fill" aria-hidden="true"></i>
                    </div>
                    <div class="stat-card-content">
                        <p class="stat-card-label">Conversas</p>
                        <h3 id="statConversasValue" class="stat-card-value">0</h3>
                        <div class="stat-card-footer">
                            <span id="statConversasDetail" class="stat-card-period">Sincronizando...</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = '/api';

        $(document).ready(function() {
            console.log('✓ Dashboard carregado');
            
            checkAuth();
        });

        function checkAuth() {
            const token = localStorage.getItem('token');
            const userStr = localStorage.getItem('user');

            if (!token || !userStr) {
                console.log('✗ Não autenticado, redirecionando...');
                window.location.href = 'login.html';
                return;
            }

            try {
                const user = JSON.parse(userStr);
                console.log('✓ Usuário:', user);

                fetchDashboardStats();

            } catch (e) {
                console.error('✗ Erro ao processar usuário:', e);
                window.location.href = 'login.html';
            }
        }

        function fetchDashboardStats() {
            const token = localStorage.getItem('token');
            const endpoint = token ? API_URL + '/dashboard/stats' : '/api-public/dashboard/stats';
            const headers = token ? { 'Authorization': 'Bearer ' + token } : {};

            $.ajax({
                url: endpoint,
                method: 'GET',
                headers,
                success: function(response) {
                    const payload = response && response.success ? response.data : response;
                    if (!payload) {
                        console.warn('V Dados do dashboard inválidos', response);
                        return;
                    }

                    updateStats(payload);
                },
                error: function(xhr) {
                    console.error('V Falha ao carregar stats', xhr.responseJSON || xhr.statusText);
                }
            });
        }

        function updateStats(stats) {
            const leads = stats.leads || {};
            const conversas = stats.conversas || {};
            const imoveis = stats.imoveis || {};

            setStat('#statLeadsValue', leads.total);
            setStat('#statPropertiesValue', imoveis.total);
            setStat('#statConversasValue', conversas.ativas ?? conversas.total);

            $('#statLeadsDetail').text(`Novos: ${formatNumber(leads.novos)} • Em atendimento: ${formatNumber(leads.em_atendimento)}`);
            $('#statPropertiesDetail').text(`Ativos: ${formatNumber(imoveis.ativos)}`);
            $('#statConversasDetail').text(`Hoje: ${formatNumber(conversas.hoje)} • Aguardando: ${formatNumber(conversas.aguardando)}`);
        }

        function setStat(selector, value) {
            $(selector).text(formatNumber(value));
        }

        function formatNumber(value) {
            const parsed = Number(value ?? 0);
            if (Number.isNaN(parsed)) {
                return '0';
            }

            return new Intl.NumberFormat('pt-BR').format(parsed);
        }
    </script>
    <script src="sidebar.js"></script>
</body>
</html>
